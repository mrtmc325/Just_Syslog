#
# One config -> .deb and .rpm via nfpm (https://nfpm.goreleaser.com).
# @@ARCH@@ and @@BIN@@ are rendered by packaging/linux/build-linux-packages.sh (sed).
name: syslog-collector
arch: "@@ARCH@@"
platform: linux
version: "1.0.0"
maintainer: Tristan Conner <tristan@conner.house>
description: |
  Lean syslog server. Receives UDP/514 from network hosts, parses RFC 3164 /
  RFC 5424 (and anything else, best-effort), stores newline-delimited JSON
  logs, and serves a local web viewer on 127.0.0.1:8514. Runs as a systemd
  service that starts at boot.
license: Proprietary
section: admin
priority: optional
contents:
  - src: "@@BIN@@"
    dst: /usr/bin/syslog-collector
    file_info:
      mode: 0755
  - src: packaging/systemd/syslog-collector.service
    dst: /lib/systemd/system/syslog-collector.service
    file_info:
      mode: 0644
  - src: packaging/config.sample.txt
    dst: /etc/syslog-collector/config.txt
    type: "config|noreplace"
    file_info:
      mode: 0644
scripts:
  postinstall: packaging/linux/postinstall.sh
  preremove: packaging/linux/preremove.sh
