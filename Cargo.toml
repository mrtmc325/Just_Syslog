[package]
name = "syslog-collector"
version = "1.0.2"
edition = "2021"
rust-version = "1.71"
authors = ["Tristan Conner <tristan@conner.house>"]
description = "Lean cross-platform syslog (UDP/514) collector with a local web viewer."
license = "MIT"
publish = false

[[bin]]
name = "syslogd"
path = "src/main.rs"

# External deps are platform-gated and exact-pinned. The portable core (parser/
# HTTP/storage) builds with std alone, so its logic is testable on any OS.
[target.'cfg(windows)'.dependencies]
windows-service = "=0.8.1"

# libc: drop root to a dedicated account after binding UDP/514 on Unix (used by
# the macOS root daemon; a no-op under systemd, which already runs as a user).
[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[profile.release]
lto = true
codegen-units = 1
strip = true
